<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chợ Nổi — Pixel Adventure</title>
<style>
:root{--ink:#173047;--cream:#fff3d5;--gold:#f6c65b;--teal:#4cbdad;--red:#ed6b63}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#10283a;color:var(--cream);font:14px/1.4 system-ui,sans-serif}
body{display:grid;place-items:center;padding:14px}
.game{width:min(1100px,100%);border:4px solid #f3c96b;background:#183b50;box-shadow:0 0 0 4px #091c2a,0 14px 40px #06131dcc}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 16px;background:#214c60;border-bottom:3px solid #0c293a}
.brand{font-weight:900;letter-spacing:1px;color:#ffe29a;font-size:clamp(16px,2.5vw,23px);text-shadow:2px 2px #10283a}
.sub{font-size:11px;color:#b9d6d7}
.pill{border:2px solid #f4d184;background:#102d40;padding:6px 10px;font-weight:800;color:#ffe29a}
main{padding:12px}
.hud{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-bottom:10px}
.stat{background:#102d40;border:2px solid #37677a;padding:8px 10px;min-height:54px}
.stat small{display:block;color:#9fc5c9;font-size:10px;text-transform:uppercase;letter-spacing:1px}
.stat strong{font-size:17px;color:#fff0c6}
.meter{height:9px;background:#071b29;border:1px solid #6e9298;margin-top:5px}
.meter i{display:block;height:100%;background:var(--teal);width:0}
.stage{position:relative;border:4px solid #eac36e;background:#0b2638;overflow:hidden}
canvas{display:block;width:100%;height:auto;aspect-ratio:16/9;image-rendering:pixelated}
.bottom{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:10px 4px 2px;color:#b8d4d5;font-size:12px}
.keys{color:#ffe29a;font-weight:800}
.status{min-height:22px;color:#f6d98d}
.events{display:flex;gap:6px;flex-wrap:wrap;margin-top:7px}
.event{background:#254e60;border:1px solid #497788;padding:4px 7px;font-size:11px;color:#d6e9df}
.overlay{position:absolute;inset:0;display:none;place-items:center;background:#071b29b8;text-align:center}
.overlay.show{display:grid}
.dialog{padding:22px 30px;background:#173b50;border:3px solid #f4cf77;box-shadow:5px 5px #071b29}
.dialog h2{margin:0 0 8px;color:#ffe29a}
button{cursor:pointer;border:2px solid #ffe29a;background:#e6a94e;color:#173047;font-weight:900;padding:8px 14px;margin-top:8px}
@media(max-width:650px){body{padding:0}.game{border-width:2px}.top{padding:9px}.hud{grid-template-columns:repeat(2,minmax(0,1fr))}main{padding:7px}.bottom{font-size:11px}}
</style>
</head>
<body>
<div class="game">
  <header class="top">
    <div><div class="brand">✦ CHỢ NỔI PIXEL ✦</div><div class="sub">Út Sen và một ngày trên sông nước miền Tây</div></div>
    <div class="pill" id="phase">ĐANG KẾT NỐI…</div>
  </header>
  <main>
    <section class="hud" id="hud">
      <div class="stat"><small>Thời gian</small><strong id="time">--:--</strong></div>
      <div class="stat"><small id="stat2label">Trạng thái</small><strong id="stat2">Đang tải</strong><div class="meter"><i id="meter2"></i></div></div>
      <div class="stat"><small id="stat3label">Máu</small><strong id="stat3">—</strong><div class="meter"><i id="meter3"></i></div></div>
      <div class="stat"><small id="stat4label">Điểm</small><strong id="stat4">0</strong></div>
    </section>
    <div class="stage">
      <canvas id="screen" width="960" height="540"></canvas>
      <div class="overlay" id="overlay"><div class="dialog"><h2 id="endtitle">Kết thúc</h2><div id="endtext"></div><button id="restart">CHƠI LẠI · R</button></div></div>
    </div>
    <div class="events" id="events"></div>
    <div class="bottom"><div class="status" id="status">Đang tải trạng thái trò chơi…</div><div><span class="keys">WASD / ↑↓←→</span> di chuyển · <span class="keys">E</span> tương tác · <span class="keys">Space</span> bắt cá · <span class="keys">R</span> chơi lại</div></div>
  </main>
</div>
<script>
"use strict";
const canvas=document.getElementById("screen"),ctx=canvas.getContext("2d");
ctx.imageSmoothingEnabled=false;
let snap=null,offline=false,lastEvents="",pollBusy=false;
const held=new Set(), keyMap={w:"u",arrowup:"u",s:"d",arrowdown:"d",a:"l",arrowleft:"l",d:"r",arrowright:"r"};
const names={ca_loc:"Cá lóc",ca_linh:"Cá linh",ca_keo:"Cá kèo",bong_dien_dien:"Bông điên điển",bong_sung:"Bông súng",keo_neo:"Kèo nèo"};
const colors={ca_loc:"#86a85c",ca_linh:"#d6e7d9",ca_keo:"#d69b60",bong_dien_dien:"#ffd34f",bong_sung:"#ef8db0",keo_neo:"#8fd27c"};
const dishNames={ca_loc_nuong_trui:"Cá lóc nướng trui",goi_bong_sung:"Gỏi bông súng",lau_ca_linh_dien_dien:"Lẩu cá linh điên điển"};
const $=id=>document.getElementById(id);
function sendInput(){
 const mode=snap?.mode||"gather";
 const x=(held.has("r")?1:0)-(held.has("l")?1:0);
 let y=(held.has("d")?1:0)-(held.has("u")?1:0);
 if(mode==="quan")y=-y;
 fetch("/input",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({move:[x,y],interact:held.has("interact"),catch:held.has("catch")})}).catch(()=>{});
}
async function restart(){held.clear();try{await fetch("/restart",{method:"POST"});$("overlay").classList.remove("show");$("status").textContent="Đã bắt đầu lượt chơi mới.";}catch(e){}}
$("restart").addEventListener("click",restart);
addEventListener("keydown",e=>{
 const k=e.key.toLowerCase();
 if(keyMap[k]){held.add(keyMap[k]);e.preventDefault();}
 else if(k==="e")held.add("interact");
 else if(k===" "){held.add("catch");e.preventDefault();}
 else if(k==="r"){restart();return;}
 else return;
 sendInput();
});
addEventListener("keyup",e=>{
 const k=e.key.toLowerCase();
 if(keyMap[k])held.delete(keyMap[k]);
 else if(k==="e")held.delete("interact");
 else if(k===" ")held.delete("catch");
 sendInput();
});
addEventListener("blur",()=>{held.clear();sendInput();});
async function poll(){
 if(pollBusy)return;
 pollBusy=true;
 try{const r=await fetch("/state",{cache:"no-store"});if(!r.ok)throw Error("HTTP "+r.status);snap=await r.json();offline=false;updateHud();}
 catch(e){offline=true;$("status").textContent="Không kết nối được máy chủ. Hãy kiểm tra terminal đang chạy chonoi.live.";}
 finally{pollBusy=false;setTimeout(poll,100);}
}
function fmtTime(t){const s=Math.ceil((t||0)/60);return `${Math.floor(s/60)}:${String(s%60).padStart(2,"0")}`;}
function updateHud(){
 if(!snap)return;
 const gather=snap.mode==="gather",p=snap.player||{};
 $("phase").textContent=gather?"☀ BUỔI SÁNG · ĐI THU HOẠCH":"☾ BUỔI TỐI · MỞ QUÁN";
 $("time").textContent=fmtTime(snap.time_left_ticks);
 $("stat2label").textContent=gather?"Oxy":"Tiền kiếm được";
 $("stat2").textContent=gather?`${Math.ceil((p.oxygen_ticks||0)/60)} giây`:`${snap.money??0} xu`;
 $("meter2").style.width=gather&&p.oxygen_max_ticks?`${100*p.oxygen_ticks/p.oxygen_max_ticks}%`:"100%";
 $("meter2").style.background=gather&&p.oxygen_ticks<p.oxygen_max_ticks*.25?"#ed6b63":"#4cbdad";
 $("stat3label").textContent=gather?"Sinh lực":"Uy tín";
 $("stat3").textContent=gather?`${p.hp??0}/${p.hp_max??0} ♥`:`${Number(snap.reputation??0).toFixed(1)}/5`;
 $("meter3").style.width=gather&&p.hp_max?`${100*p.hp/p.hp_max}%`:`${100*(snap.reputation||0)/5}%`;
 $("stat4label").textContent=gather?"Giỏ nguyên liệu":"Điểm";
 $("stat4").textContent=gather?`${snap.hold_count??(snap.hold||[]).length}/${snap.hold_capacity??12}`:`${snap.score??0}`;
 $("status").textContent=gather?`Vị trí: ${p.pos?.map(v=>Number(v).toFixed(1)).join(", ")||"—"} · Hãy lặn xuống bắt cá, hái bông rồi quay về bến.`:`Trên tay: ${snap.hand?(dishNames[snap.hand.dish_id]||snap.hand.dish_id||"có món"):"trống"} · Tiền: ${snap.earned??0} xu · Kho và đơn hàng được hiển thị trong cảnh.`;
 const ev=(snap.events||[]).slice(-4).reverse();
 $("events").innerHTML=ev.map(e=>`<span class="event">T${e.tick} · ${eventLabel(e.name)}</span>`).join("");
 if(snap.finished){$("overlay").classList.add("show");$("endtitle").textContent=gather?"KẾT THÚC BUỔI SÁNG":"ĐÓNG CỬA QUÁN";$("endtext").textContent=`Lý do: ${snap.reason||"hoàn thành"} · Điểm: ${snap.score??0} · Tiền: ${snap.money??0} xu`;}
 else $("overlay").classList.remove("show");
}
function eventLabel(n){return ({gather:"Đã hái nguyên liệu",fish_caught:"Bắt được cá",node_regrown:"Nguyên liệu mọc lại",dive:"Đã lặn xuống",surface:"Đã ngoi lên",choke:"Thiếu oxy",faint:"Ngất xỉu",customer_arrived:"Khách vừa đến",cook_started:"Bếp bắt đầu nấu",dish_ready:"Món đã chín",dish_picked:"Đã lấy món",served:"Đã phục vụ",paid:"Khách thanh toán",customer_left:"Khách rời đi",no_dish:"Không đủ nguyên liệu"})[n]||n;}
function rect(x,y,w,h,c){ctx.fillStyle=c;ctx.fillRect(Math.round(x),Math.round(y),Math.round(w),Math.round(h));}
function txt(s,x,y,size=14,color="#fff0c6",align="left"){ctx.font=`bold ${size}px monospace`;ctx.textAlign=align;ctx.fillStyle="#173047";ctx.fillText(s,x+2,y+2);ctx.fillStyle=color;ctx.fillText(s,x,y);}
function panel(x,y,w,h){rect(x,y,w,h,"#102d40");rect(x,y,w,3,"#f3c96b");rect(x,y+h-3,w,3,"#f3c96b");rect(x,y,3,h,"#f3c96b");rect(x+w-3,y,3,h,"#f3c96b");}
function playerSprite(x,y,scale=1){
 // Nhân vật pixel nhỏ, không dùng ảnh ngoài
 const s=scale;rect(x-8*s,y-13*s,16*s,7*s,"#3c2736");rect(x-6*s,y-17*s,12*s,7*s,"#f2bd91");
 rect(x-7*s,y-10*s,14*s,13*s,"#e87843");rect(x-7*s,y+3*s,5*s,8*s,"#263e59");rect(x+2*s,y+3*s,5*s,8*s,"#263e59");
 rect(x-4*s,y-15*s,2*s,2*s,"#173047");rect(x+3*s,y-15*s,2*s,2*s,"#173047");
}
function fishSprite(x,y,s,c){
 rect(x-s,y-3*s,2*s,6*s,c);rect(x-s*2,y-s*2,s*2,s*4,c);rect(x,y-s*3,s*5,s*6,c);rect(x+s*5,y-s*2,s*2,s*4,c);rect(x+s*2,y-s,2*s,2*s,"#173047");
}
function plantSprite(x,y,s,c){
 rect(x-2*s,y,4*s,9*s,"#398b63");rect(x-9*s,y-5*s,8*s,4*s,c);rect(x+2*s,y-9*s,9*s,4*s,c);rect(x-4*s,y-13*s,8*s,4*s,c);
}
function drawGather(){
 const m=snap.meta||{},b=m.bounds||{x:[0,100],d:[0,30]},p=snap.player||{pos:[2,0]};
 const left=42,top=85,ww=876,hh=350,scale=Math.min(ww/(b.x[1]-b.x[0]),hh/(b.d[1]-b.d[0]));
 const X=x=>left+(x-b.x[0])*scale,Y=d=>top+d*scale;
 rect(0,0,960,540,"#9bd7e6");rect(0,0,960,72,"#f8d78b");
 // mây pixel
 for(let x=60;x<930;x+=190){rect(x,24,46,10,"#fff4d7");rect(x+12,14,28,10,"#fff4d7");}
 rect(left,top,ww,hh,"#1685a5");
 for(let d=5;d<=b.d[1];d+=5){rect(left,Y(d),ww,1,"#ffffff18");txt(`${d}m`,left+5,Y(d)-4,10,"#bcecf0");}
 // dải mặt nước
 rect(left,top,ww,5,"#d8f4df");
 // đáy sông
 rect(left,Y(b.d[1])-10,ww,10,"#28566a");
 // rong
 for(let x=70;x<900;x+=95){rect(x,Y(b.d[1])-24,5,14,"#3d9169");rect(x+6,Y(b.d[1])-30,5,20,"#3d9169");}
 const dock=m.dock_pos||[2,0],dx=X(dock[0]);
 rect(dx-17,top-15,34,15,"#8e5939");rect(dx-21,top-23,42,8,"#b66b43");rect(dx-4,top-37,8,22,"#6c4635");txt("BẾN",dx,top-43,11,"#fff0c6","center");
 (snap.nodes||[]).forEach(n=>{const x=X(n.pos[0]),y=Y(n.pos[1]);plantSprite(x,y,1.4,colors[n.kind]||"#f1c75b");txt(n.ready===false?"…":(names[n.kind]||n.kind),x,y+22,10,"#fff0c6","center");});
 (snap.fish||[]).forEach(f=>{const x=X(f.pos[0]),y=Y(f.pos[1]);fishSprite(x,y,2,colors[f.kind]||"#dce8dd");});
 const px=X(p.pos?.[0]||0),py=Y(p.pos?.[1]||0);
 // vòng tương tác
 if(m.interact_radius&&p.at_surface!==false){ctx.strokeStyle="#ffe29a";ctx.setLineDash([4,5]);ctx.beginPath();ctx.arc(px,py,m.interact_radius*scale,0,Math.PI*2);ctx.stroke();ctx.setLineDash([]);}
 playerSprite(px,py,1.3);
 panel(18,455,924,68);
 txt("GIỎ NGUYÊN LIỆU",34,478,12);
 const hold=snap.hold||[];
 for(let i=0;i<(snap.hold_capacity||12);i++){const x=34+i*31;rect(x,488,25,23,"#31586a");if(hold[i])rect(x+5,493,15,13,colors[hold[i]]||"#e5c46b");}
 txt(`${hold.length}/${snap.hold_capacity||12}`,430,505,13);
 txt("WASD bơi · Space bắt cá khi lặn · E hái / cập bến",920,505,12,"#ffe29a","right");
}
function drawQuan(){
 const m=snap.meta||{},b=m.bounds||{x:[0,16],z:[0,10]},p=snap.player||{pos:[8,5]};
 rect(0,0,960,540,"#8bc7c2");
 // nền sàn dạng caro pixel
 const x0=145,y0=92,w=670,h=370,cell=42;
 for(let y=0;y<Math.ceil(h/cell);y++)for(let x=0;x<Math.ceil(w/cell);x++)rect(x0+x*cell,y0+y*cell,cell,cell,(x+y)%2?"#e7bd7d":"#d9a96b");
 rect(x0,y0,w,8,"#75472f");rect(x0,y0+h-8,w,8,"#75472f");rect(x0,y0,8,h,"#75472f");rect(x0+w-8,y0,8,h,"#75472f");
 const X=x=>x0+x/b.x[1]*w,Y=z=>y0+h-z/b.z[1]*h;
 // cửa và trang trí
 rect(x0+18,y0+18,78,12,"#5b8e75");txt("CHỢ NỔI",x0+57,y0+44,12,"#fff0c6","center");
 // quầy bếp
 (snap.stoves||[]).forEach(st=>{
  const x=X(st.pos[0]),y=Y(st.pos[1]),c=st.state==="ready"?"#70bd76":st.state==="cooking"?"#ed8846":"#536b70";
  rect(x-29,y-25,58,50,"#75472f");rect(x-24,y-20,48,40,c);rect(x-15,y-12,30,8,"#f6d58a");
  txt(st.state==="ready"?"CHÍN":st.state==="cooking"?`${Math.ceil((st.cook_ticks_left||0)/60)}s`:"BẾP",x,y+39,11,"#fff0c6","center");
 });
 const byTable={};(snap.customers||[]).forEach(c=>byTable[c.table_id]=c);
 (snap.tables||[]).forEach(tb=>{
  const x=X(tb.pos[0]),y=Y(tb.pos[1]);rect(x-28,y-17,56,34,"#8b5635");rect(x-23,y-12,46,24,"#d7a35d");
  txt(tb.id,x,y+4,10,"#fff0c6","center");
  const c=byTable[tb.id];if(c){
   // khách
   rect(x-9,y-43,18,18,c.state==="eating"?"#72b96e":"#e9a4a9");rect(x-12,y-28,24,19,"#426d92");rect(x-5,y-38,3,3,"#173047");rect(x+3,y-38,3,3,"#173047");
   txt((dishNames[c.dish_id]||c.dish_id||"Đơn").slice(0,17),x,y-51,10,"#173047","center");
   const max=(m.patience_s||60)*60,frac=Math.max(0,Math.min(1,(c.patience_ticks_left??max)/max));
   rect(x-22,y-7,44,5,"#563b35");rect(x-22,y-7,44*frac,5,"#e76e67");
  }
 });
 const px=X(p.pos?.[0]||0),py=Y(p.pos?.[1]||0);
 ctx.strokeStyle="#fff0c6";ctx.setLineDash([4,5]);ctx.beginPath();ctx.arc(px,py,(m.interact_radius||1.5)/b.x[1]*w,0,Math.PI*2);ctx.stroke();ctx.setLineDash([]);
 playerSprite(px,py,1.3);
 // kho khả dụng trừ phần nguyên liệu đã giữ chỗ
 const reserved={};(snap.customers||[]).forEach(c=>Object.entries(c.reserved||{}).forEach(([k,v])=>reserved[k]=(reserved[k]||0)+v));
 const stock=Object.entries(snap.stock||{}).map(([k,v])=>`${names[k]||k} ${Math.max(0,v-(reserved[k]||0))}`).join(" · ")||"Kho trống";
 panel(18,455,924,68);txt("KHO KHẢ DỤNG",34,478,12);txt(stock,34,502,13,"#fff0c6");
 txt(`Trên tay: ${snap.hand?(dishNames[snap.hand.dish_id]||snap.hand.dish_id||"món ăn"):"trống"}`,920,478,12,"#ffe29a","right");
 txt("WASD di chuyển · E nấu / lấy món / phục vụ khách",920,505,12,"#ffe29a","right");
}
function render(){
 ctx.clearRect(0,0,960,540);
 if(!snap){rect(0,0,960,540,"#102d40");txt(offline?"MẤT KẾT NỐI MÁY CHỦ":"ĐANG TẢI TRÒ CHƠI…",480,270,22,"#ffe29a","center");return;}
 if(snap.mode==="gather")drawGather();else drawQuan();
 if(snap.error){rect(200,225,560,70,"#102d40");txt("LỖI MÔ PHỎNG — KIỂM TRA TERMINAL",480,265,17,"#ffb0a8","center");}
}
function loop(){render();requestAnimationFrame(loop);}
poll();loop();
</script>
</body>
</html>
